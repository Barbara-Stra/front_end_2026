<!DOCTYPE html>
<html lang="pt-br">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> CAIXA LIVRE </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<head>
    <style>
        .topo{
            background-color: #ffc107;
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            border: 4px solid #01026b;
        }

        .painel{
            background: #404042;
            padding: 10;
            margin-bottom: 10px;
            border: 3px solid #1e1e1e;
        }

    </style>
</head>

<!--mt-3 (divide a página em 3, tamanho do viewport)-->

<body class="bg-primary bg-gradient">
<div id="Alert"><br></div>

<div class="container mt-3"> <!--Caixa de fora do topo, que engloba tudo-->
    <div class="topo"> CAIXA LIVRE </div>

    <div class="row mt-3">  <!--Caixa externa também, porém, dentro da caixa maior-->
        
        <div class="col-md-7"> <!--Agora estamos criando ela na columa, em vez de criar na linha-->
            <h3 class="text-white"><span class="badge text-bg-primary"> SUA COMPRA 🛒 </span></h3>
            <ul id="lista" class="list-group lista"></ul>
        </div>

        <div class="col-md-5"> <!--Md-5 porque os itens tem que ser menores que o md-7 (sua compra)-->
            <div class="painel"> Total: R$ <span id="Total"> 0.00 </span> </div>
        
            <div class="painel">
                <label> Código de Barras </label>
                <input type="text" id="cod" class="form-control">
            </div>

            <div class="painel">
                <label> Quantidade </label>
                <input type="text" id="qtd" class="form-control" value="1">
            </div>

            <div class="painel">
                <label> Quantidade X Valor </label>
                <div class="alert alert-light" role="alert"><span id="qtdXv1"> 0.00 </span></div>
            </div>

            <button class="btn btn-success w-100" onclick="addProduto()">
                Adicionar Produto
            </button>
        </div>

    </div>

</div>
<script src="sript.js"></script>
</body>

</html>
