<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UtF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>Atividades da semana 9</title>
</head>

<body>
    <div>
        <h1 class="titulo_principal">Atividades da semana 9</h1>
    </div>
<!---------------------------------------------------------------------------------------------->
    <div class="card">
        <h1>Validador de cpf</h1>
        <label>Digite seu cpf (apenas numeros)</label>
        <input type="text" id="cpf" placeholder="Digite aqui seu cpf">
        <button id="botaoCPF" onclick="validar_cpf()">Validar cpf</button>
        <label for="validade"></label>
        <input type="text" id="validade">
    </div>
<!---------------------------------------------------------------------------------------------->
    <div class="card">
        <h1>Conversor de temperatura</h1>
        <form>
            <label for="celsius">Celsius</label>
            <input type="number" id="celsius" placeholder="Digite aqui a temperatura" step="0.1" oninput="calcular_farenheit()">

            <br>

            <br>

            <label for="farenheit">Farenheit</label>
            <input type="number" id="farenheit" placeholder="Digite aqui a temperatura" step="0.1" oninput="calcular_celsius()">

        </form>
    </div>
<!---------------------------------------------------------------------------------------------->
    <div class="card">
        <h1>Média Escolar</h1>
        <label>Insira seu nome</label>
        <input type="text" placeholder="Insira seu nome aqui">

        <label>Insira sua nota 1</label>
        <input type="number" step="0.1" id="nota1" placeholder="Insira sua nota aqui">

        <label>Insira sua nota 2</label>
        <input type="number" step="0.1" id="nota2" placeholder="Insira sua nota aqui">

        <label>Insira sua nota 3</label>
        <input type="number" step="0.1"id="nota3" placeholder="Insira sua nota aqui">

        <button id="botao_calcular">Calcular média</button>

        <label for="status">Status</label>
        <input id="status">

    </div>
<!---------------------------------------------------------------------------------------------->
    <div class="card">
        <h1>Taxas Infinity Bank</h1>

        <label for="bandeira">Selecione sua Bandeira</label>
            <select name="bandeira" id="bandeira">
                <option value="visa">Visa</option>
                <option value="master">Master</option>
                <option value="elo">Elo</option>
            </select>

        <label>Insira o valor</label>
        <input type="number" step="0.1" id="valor" placeholder="Insira o valor aqui">

        <label>Insira o número de parcelas</label>
        <input type="number" step="0.1" id="parcelas" placeholder="Insira o número de parcelas aqui">

        <button onclick="calcular_resumo()">Calcular Resumo</button>

        <label for="resumo">Exibir resumo</label>
        <input id="valor_taxa">
        <input id="valor_juros">
        <input id="valor_parcela">

    </div>
<!---------------------------------------------------------------------------------------------->
     <div class="todo-app">
        <h2>Lista de Convidados</h2>
        <input type="text" id="taskInput" placeholder="Adicione um convidado">
        <button onclick="addTask()">Adicionar</button>
        <ul id="taskList"></ul>
    </div>
    
</body>

<script src="script.js"></script>

</html>
